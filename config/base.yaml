# Project parameters. Whatever the scripts read comes from here, not from the code.

data:
  raw_dir: data/raw/omie          # marginalpdbc_YYYYMMDD.1 files exactly as OMIE serves them
  processed_dir: data/processed   # omie_prices.parquet
  start: 2021-01-01
  end: null                       # null = up to yesterday

battery:
  # 2 h, like the batteries currently being connected in Spain.
  duration_hours: 2
  # Round trip (charge + discharge), AC side. 0.85 is a typical value for LFP
  # including auxiliaries; ASSUMPTION, replace with the manufacturer's figure if available.
  round_trip_efficiency: 0.85
  # Usual warranties: ~1 cycle/day. ASSUMPTION.
  max_cycles_per_year: 365

curves:
  # OMIE aggregated curves (curva_pbc, ~19 MB a day). Each file is reduced to a
  # compact parquet of a few hundred KB and, unless keep_raw, deleted.
  raw_dir: data/raw/omie_curves
  compact_dir: data/processed/curves
  start: 2025-10-01               # first quarter-hourly day-ahead day; 2024-01-01 for more history
  end: null                       # null = up to yesterday
  workers: 4                      # parallel downloads; more would only strain OMIE's server
  keep_raw: false

impact:
  # Stage 1 of the BESS cannibalisation roadmap: X GW of storage on each day's curves.
  output_dir: data/processed/impact
  grid_gw: [0, 1, 2, 4, 6, 8, 10, 12, 15, 17, 20]
  # The ratio pX/p0 is left empty where |p0| is below this (€/MWh): near zero it explodes.
  min_abs_price: 5
